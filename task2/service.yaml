apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app: myapp
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http

---

apiVersion: v1
kind: Service
metadata:
  name: multitool
spec:
  selector:
    app: myapp
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
